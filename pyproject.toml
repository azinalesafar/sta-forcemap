[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sta-forcemap"
dynamic = ["version"]
description = "Interactive solvent-tip-approximation (STA) force maps of interfacial water from MD trajectories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Azin Alesafar", email = "azin.alesafar@gmail.com" }]
requires-python = ">=3.9"
keywords = ["molecular dynamics", "AFM", "hydration layer", "solid-liquid interface", "ase", "plotly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "ase>=3.22",
    "plotly>=5.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sta-forcemap = "sta_forcemap.cli:main"

[project.urls]
Homepage = "https://github.com/azinalesafar/sta-forcemap"
Issues = "https://github.com/azinalesafar/sta-forcemap/issues"

[tool.hatch.version]
path = "src/sta_forcemap/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["examples/*.traj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
